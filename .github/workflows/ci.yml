name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r backend/requirements.txt
      - run: pytest -q
        working-directory: backend
      - run: DATABASE_URL=sqlite:////tmp/migration.db alembic upgrade head
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
      - run: npm run test:core
      - run: npm --workspace ai-tutor-web run type-check
      - run: npm --workspace ai-tutor-web test -- --passWithNoTests
      - run: npm run build:web
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
